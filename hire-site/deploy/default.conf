# =============================================================================
# SITE ROOTS
#
#   /config/www/bross     -> bross.cloud, admin.bross.cloud, new.bross.cloud
#   /config/www/natural   -> naturalcarr.com
#
# The two sites are fully separated: each root holds its own assets/ tree, so
# absolute paths like /assets/... resolve within the requesting site only.
# Blocks below are tagged [bross.cloud] / [naturalcarr.com] / [shared].
# =============================================================================

# =============================================================================
# [naturalcarr.com]  Natural Carr IT services
# =============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name bross.naturalcarr.com;
    root /config/www/hire;
    index index.html;

    ssl_certificate     /config/keys/letsencrypt/fullchain.pem;
    ssl_certificate_key /config/keys/letsencrypt/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}

# =============================================================================
# [shared]  Undeclared subdomain handling (default server)
# =============================================================================
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # root /config/www;
    # index index.html index.htm index.php;

    ssl_certificate     /config/keys/letsencrypt/fullchain.pem;
    ssl_certificate_key /config/keys/letsencrypt/privkey.pem;

    # location / {
    #     try_files $uri $uri/ /index.html /index.php?$args =404;
    #     return 301 https://bross.cloud$request_uri;
    # }

    return 444;  # this will close the connection
}

# =============================================================================
# [shared]  Convert HTTP to HTTPS
# =============================================================================
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# =============================================================================
# [bross.cloud]  Main
# =============================================================================
server {
    # Basic Configuration
    listen 443 ssl;
    http2 on;
    server_name bross.cloud;
    root /config/www/bross;
    index index.html index.htm index.php;

    # Shared TLS 1.2/1.3 configuration
    include /config/nginx/ssl.conf;

    # Client Configuration
    client_max_body_size 0;

    # Cache Configuration
    add_header Last-Modified $date_gmt;
    #add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
    #if_modified_since off;
    #expires off;
    #etag off;

    # Allow POST on static pages
    error_page 405 =200 $uri;

    # Default Location
    location / {
        try_files $uri $uri/ /index.html /index.php?$args =404;
        proxy_set_header X-Forwarded-Host  $host:$server_port;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # B.Ross membership gateway public routes.
    # Webhook endpoints stay unauthenticated; the app verifies provider signatures.
    location = /support {
        include /config/nginx/proxy.conf;
        proxy_pass http://192.168.1.253:3110;
    }

    location = /support/ {
        include /config/nginx/proxy.conf;
        proxy_pass http://192.168.1.253:3110;
    }

    location = /webhooks/paypal {
        include /config/nginx/proxy.conf;
        proxy_pass http://192.168.1.253:3110;
    }

    location = /webhooks/patreon {
        include /config/nginx/proxy.conf;
        proxy_pass http://192.168.1.253:3110;
    }

    # B.Ross membership gateway — supporter self-service portal.
    # The app handles its own session auth; do not add proxy-level auth here.
    location /manage {
        include /config/nginx/proxy.conf;
        proxy_pass http://192.168.1.253:3110;
    }


    # Error Pages
    error_page 401 /401.html;
    location /401.html {
        internal;
    }

    # Node/Express API (bross-api container) — track metadata, cover art, and
    # the asset listings that used to be served by assets/php/*.php.
    # Static files stay on nginx; only /api/ is proxied.
    location /api/ {
        include /config/nginx/proxy.conf;
        proxy_pass http://192.168.1.253:3100;
    }

    # PHP Configuration
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include /etc/nginx/fastcgi_params;
    }
}

