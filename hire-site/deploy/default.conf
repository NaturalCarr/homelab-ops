# =============================================================================
# [bross.cloud]  ADMIN
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name admin.bross.cloud;

    include /config/nginx/ssl.conf;

    root /config/www/bross;
    index admin.html;

    # Require authentication for every location in this server.
    auth_basic "restricted";
    auth_basic_user_file /config/htpasswd/admin;

    # Default Location
    location / {
        try_files $uri $uri/ /admin.html /index.php?$args =404;
    }

    # Error Pages
    error_page 401 /401.html;
    location /401.html {
        internal;
        auth_basic off;
    }

    # Youtube-dl
    location /youtube-dl {
        proxy_pass http://192.168.1.253:8282/youtube-dl;
     #   auth_basic "For Admins Only";
     #   auth_basic_user_file /config/htpasswd/admin;
    }

    # tube-sync
    location /youtube-dl-auto {
        rewrite /youtube-dl-auto(.*) /$1 break;
        proxy_pass http://192.168.1.253:4848;
     #   auth_basic "For Admins Only";
     #   auth_basic_user_file /config/htpasswd/admin;
    }

    # PHP Configuration
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include /etc/nginx/fastcgi_params;
    }
}

